<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story Creator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f4f7f6 0%, #dfe4e6 100%);
            color: white;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .phone-container {
            position: relative;
            width: 430px;
            height: 850px;
            background: #ffffff;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1), 0 0 0 1px rgba(0,0,0,0.05);
            border: 8px solid #333;
            overflow: hidden;
            transition: box-shadow 0.3s ease;
        }
        
        .phone-container:hover {
            box-shadow: 0 15px 40px rgba(0,0,0,0.15), 0 0 0 1px rgba(0,0,0,0.08);
        }

        .phone-notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 28px;
            background: #000;
            border-radius: 0 0 20px 20px;
            z-index: 100;
        }

        .phone-screen {
            width: 100%;
            height: 100%;
            background: #000;
            position: relative;
            overflow: hidden;
        }

        .instagram-home {
            width: 100%;
            height: 100%;
            background: #fafafa;
            display: flex;
            flex-direction: column;
        }

        .insta-header {
            padding: 50px 20px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #dbdbdb;
            background: #fff;
        }

        .insta-logo {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(45deg, #667eea, #764ba2, #667eea);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .insta-stories {
            display: flex;
            gap: 15px;
            padding: 15px 20px;
            overflow-x: auto;
            border-bottom: 1px solid #dbdbdb;
            background: #fff;
        }

        .story-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .story-avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .story-avatar.add-new {
            background: #fafafa;
            border: 2px dashed #dbdbdb;
        }

        .story-avatar-inner {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .plus-icon {
            font-size: 32px;
            color: #667eea;
        }

        .story-name {
            font-size: 12px;
            color: #262626;
        }

        .insta-feed {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .feed-post {
            background: #fff;
            border-radius: 12px;
            margin-bottom: 20px;
            overflow: hidden;
            border: 1px solid #dbdbdb;
        }

        .post-header {
            padding: 12px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .post-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(45deg, #667eea, #764ba2);
        }

        .post-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.8);
            font-size: 14px;
        }

        .creator-page {
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            background: #000;
        }

        .creator-page.active {
            display: flex;
        }

        .creator-header {
            padding: 50px 20px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .back-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #222;
            border: none;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .creator-title {
            font-size: 18px;
            font-weight: 600;
        }

        .canvas-container {
            flex: 1;
            position: relative;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
        }

        .video-container-draggable {
            position: absolute;
            cursor: move;
            border: 3px solid transparent;
            border-radius: 12px;
            user-select: none;
            padding: 4px;
        }

        .video-container-draggable.selected {
            border-color: #fff;
            box-shadow: 0 0 0 2px #667eea;
            cursor: move;
        }

        .video-container-draggable video {
            width: 100%;
            height: 100%;
            border-radius: 10px;
            display: block;
            cursor: pointer;
        }

        .resize-handle {
            position: absolute;
            width: 24px;
            height: 24px;
            background: #667eea;
            border: 3px solid white;
            border-radius: 50%;
            cursor: nwse-resize;
            right: -12px;
            bottom: -12px;
            z-index: 10;
        }

        .text-overlay {
            position: absolute;
            cursor: move;
            padding: 12px 20px;
            background: rgba(0,0,0,0.6);
            border-radius: 12px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-align: center;
            border: 3px solid transparent;
            user-select: none;
        }

        .text-overlay.selected {
            border-color: #fff;
            box-shadow: 0 0 0 2px #667eea;
        }

        .creator-bottom {
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(10px);
            padding: 15px;
        }

        .action-btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            font-size: 15px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .action-btn.primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .action-btn.secondary {
            background: #222;
            color: white;
        }

        .action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .tool-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .tool-btn {
            flex: 1;
            padding: 12px;
            background: #222;
            border: none;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 11px;
        }

        .tool-btn:active {
            background: #333;
        }

        .bg-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            overflow-x: auto;
            padding: 5px 0;
        }

        .bg-option {
            min-width: 50px;
            height: 50px;
            border-radius: 10px;
            border: 3px solid transparent;
            cursor: pointer;
            flex-shrink: 0;
        }

        .bg-option.selected {
            border-color: white;
        }

        .empty-state {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: rgba(255,255,255,0.5);
        }

        input[type="file"] {
            display: none;
        }

        .processing-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.95);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 1000;
        }

        .processing-overlay.show {
            display: flex;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #333;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .modal-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.9);
            z-index: 500;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 24px;
            width: 90%;
            max-width: 380px;
            max-height: 80vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease-out;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .avatar-preview {
            width: 200px;
            height: 200px;
            margin: 0 auto 24px;
            border-radius: 12px;
            background: #ecf0f1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .avatar-preview canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .preview-loading {
            color: #6b7280;
            font-size: 14px;
            text-align: center;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
            color: #34495e;
        }

        .close-modal-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #f3f4f6;
            border: none;
            color: #95a5a6;
            cursor: pointer;
        }

        .close-modal-btn:hover {
            background: #e5e7eb;
        }

        .option-group {
            margin-bottom: 20px;
        }

        .option-label {
            font-size: 13px;
            font-weight: 600;
            color: #34495e;
            margin-bottom: 10px;
            display: block;
        }

        .option-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .option-btn {
            padding: 8px 14px;
            border-radius: 10px;
            border: 2px solid #ecf0f1;
            background: white;
            color: #7f8c8d;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            text-transform: capitalize;
            transition: all 0.2s;
        }

        .option-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .option-btn.selected {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-color: #667eea;
        }

        .text-input {
            width: 100%;
            padding: 12px;
            background: #0a0a0a;
            border: 2px solid #333;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            margin-bottom: 12px;
        }

        .text-input:focus {
            outline: none;
            border-color: #667eea;
        }

        svg {
            width: 24px;
            height: 24px;
        }
    </style>
</head>
<body>
    <div class="phone-container">
        <div class="phone-notch"></div>
        <div class="phone-screen">
            
            <!-- Instagram Home Page -->
            <div class="instagram-home" id="homePage" style="display: none;">
                <div class="insta-header">
                    <div class="insta-logo">StoryHub</div>
                    <svg fill="none" stroke="#262626" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/>
                    </svg>
                </div>

                <div class="insta-stories">
                    <div class="story-item" onclick="openCreator()">
                        <div class="story-avatar add-new">
                            <div class="story-avatar-inner">
                                <div class="plus-icon">+</div>
                            </div>
                        </div>
                        <div class="story-name">Create</div>
                    </div>
                    
                    <div class="story-item">
                        <div class="story-avatar">
                            <div class="story-avatar-inner"></div>
                        </div>
                        <div class="story-name">alex_m</div>
                    </div>

                    <div class="story-item">
                        <div class="story-avatar">
                            <div class="story-avatar-inner"></div>
                        </div>
                        <div class="story-name">sara_k</div>
                    </div>

                    <div class="story-item">
                        <div class="story-avatar">
                            <div class="story-avatar-inner"></div>
                        </div>
                        <div class="story-name">john_d</div>
                    </div>
                </div>

                <div class="insta-feed">
                    <div class="feed-post">
                        <div class="post-header">
                            <div class="post-avatar"></div>
                            <div>
                                <div style="font-size: 14px; font-weight: 600; color: #262626;">demo_account</div>
                                <div style="font-size: 12px; color: #8e8e8e;">3 hours ago</div>
                            </div>
                        </div>
                        <div class="post-image">Featured Story</div>
                    </div>

                    <div class="feed-post">
                        <div class="post-header">
                            <div class="post-avatar"></div>
                            <div>
                                <div style="font-size: 14px; font-weight: 600; color: #262626;">creative_user</div>
                                <div style="font-size: 12px; color: #8e8e8e;">5 hours ago</div>
                            </div>
                        </div>
                        <div class="post-image">Emotion Avatar Demo</div>
                    </div>
                </div>
            </div>

            <!-- Creator Page -->
            <div class="creator-page active" id="creatorPage">
                <div class="creator-header">
                    <button class="back-btn" onclick="closeCreator()">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="20" height="20">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                        </svg>
                    </button>
                    <div class="creator-title">Create Story</div>
                    <div style="width: 36px;"></div>
                </div>

                <div class="canvas-container" id="canvasContainer">
                    <div class="empty-state" id="emptyState">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="60" height="60">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                        </svg>
                        <div style="margin-top: 12px;">Upload audio to start</div>
                    </div>
                </div>

                <div class="creator-bottom">
                    <div class="tool-bar">
                        <button class="tool-btn" onclick="document.getElementById('audioInput').click()">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="24" height="24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
                            </svg>
                            Audio
                        </button>
                        <button class="tool-btn" onclick="openCustomization()">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="24" height="24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                            </svg>
                            Avatar
                        </button>
                        <button class="tool-btn" onclick="addText()">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="24" height="24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"/>
                            </svg>
                            Text
                        </button>
                        <button class="tool-btn" onclick="deleteSelected()">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="24" height="24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                            </svg>
                            Delete
                        </button>
                    </div>

                    <div class="bg-selector">
                        <div class="bg-option selected" style="background: linear-gradient(135deg, #667eea, #764ba2)" onclick="changeBackground(this, 'linear-gradient(135deg, #667eea, #764ba2)')"></div>
                        <div class="bg-option" style="background: linear-gradient(135deg, #f093fb, #f5576c)" onclick="changeBackground(this, 'linear-gradient(135deg, #f093fb, #f5576c)')"></div>
                        <div class="bg-option" style="background: linear-gradient(135deg, #4facfe, #00f2fe)" onclick="changeBackground(this, 'linear-gradient(135deg, #4facfe, #00f2fe)')"></div>
                        <div class="bg-option" style="background: linear-gradient(135deg, #43e97b, #38f9d7)" onclick="changeBackground(this, 'linear-gradient(135deg, #43e97b, #38f9d7)')"></div>
                        <div class="bg-option" style="background: linear-gradient(135deg, #fa709a, #fee140)" onclick="changeBackground(this, 'linear-gradient(135deg, #fa709a, #fee140)')"></div>
                        <div class="bg-option" style="background: #222; display: flex; align-items: center; justify-content: center; cursor: pointer;" onclick="document.getElementById('bgImageInput').click()">
                            <svg fill="none" stroke="white" viewBox="0 0 24 24" width="24" height="24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                            </svg>
                        </div>
                    </div>

                    <button class="action-btn primary" id="generateBtn" onclick="generateVideo()" disabled>
                        🎬 Generate Lipsync Video
                    </button>
                    <button class="action-btn secondary" onclick="postStory()">
                        📤 Post to Feed
                    </button>
                </div>

                <!-- Processing Overlay -->
                <div class="processing-overlay" id="processingOverlay">
                    <div class="spinner"></div>
                    <div style="margin-top: 20px;">Generating video...</div>
                </div>
            </div>

            <!-- Avatar Customization Modal -->
            <div class="modal-overlay" id="avatarModal">
                <div class="modal-content">
                    <div class="modal-header">
                        <div class="modal-title">🎨 Customize Avatar</div>
                        <button class="close-modal-btn" onclick="closeCustomization()">✕</button>
                    </div>

                    <!-- Avatar Preview -->
                    <div class="avatar-preview">
                        <canvas id="avatarCanvas" width="400" height="400"></canvas>
                    </div>

                    <div class="option-group">
                        <label class="option-label">Gender</label>
                        <div class="option-buttons">
                            <button class="option-btn selected" onclick="selectOption('gender', 'female', this)">Female</button>
                            <button class="option-btn" onclick="selectOption('gender', 'male', this)">Male</button>
                        </div>
                    </div>

                    <div class="option-group">
                        <label class="option-label">Hair Style</label>
                        <div class="option-buttons" id="hairStyleOptions">
                            <button class="option-btn" onclick="selectOption('hair_style', 'curly', this)">Curly</button>
                            <button class="option-btn" onclick="selectOption('hair_style', 'short', this)">Short</button>
                            <button class="option-btn selected" onclick="selectOption('hair_style', 'straight', this)">Straight</button>
                            <button class="option-btn" onclick="selectOption('hair_style', 'wavy', this)">Wavy</button>
                        </div>
                    </div>

                    <div class="option-group" id="hairColorGroup">
                        <label class="option-label">Hair Color</label>
                        <div class="option-buttons">
                            <button class="option-btn" onclick="selectOption('hair_color', 'black', this)">Black</button>
                            <button class="option-btn" onclick="selectOption('hair_color', 'blonde', this)">Blonde</button>
                            <button class="option-btn" onclick="selectOption('hair_color', 'brown', this)">Brown</button>
                            <button class="option-btn" onclick="selectOption('hair_color', 'light_brown', this)">Light Brown</button>
                            <button class="option-btn" onclick="selectOption('hair_color', 'red', this)">Red</button>
                            <button class="option-btn selected" onclick="selectOption('hair_color', 'blue', this)">Blue</button>
                            <button class="option-btn" onclick="selectOption('hair_color', 'orange', this)">Orange</button>
                        </div>
                    </div>

                    <div class="option-group">
                        <label class="option-label">Eye Color</label>
                        <div class="option-buttons">
                            <button class="option-btn" onclick="selectOption('eye_color', 'black', this)">Black</button>
                            <button class="option-btn" onclick="selectOption('eye_color', 'blue', this)">Blue</button>
                            <button class="option-btn" onclick="selectOption('eye_color', 'brown', this)">Brown</button>
                            <button class="option-btn selected" onclick="selectOption('eye_color', 'green', this)">Green</button>
                        </div>
                    </div>

                    <button class="action-btn primary" onclick="saveCustomization()">Save & Use Avatar</button>
                </div>
            </div>

            <!-- Text Input Modal -->
            <div class="modal-overlay" id="textModal">
                <div class="modal-content">
                    <div class="modal-header">
                        <div class="modal-title">Add Text</div>
                        <button class="close-modal-btn" onclick="closeTextInput()">✕</button>
                    </div>
                    <input type="text" class="text-input" id="textInput" placeholder="Enter your text..." maxlength="50">
                    <button class="action-btn primary" onclick="confirmAddText()">Add Text</button>
                </div>
            </div>

        </div>

        <input type="file" id="audioInput" accept="audio/*" onchange="handleAudioUpload(event)">
        <input type="file" id="bgImageInput" accept="image/*" onchange="handleBackgroundUpload(event)">
    </div>

    <script>
        let audioFile = null;
        let videoElement = null;
        let selectedElement = null;
        let isDragging = false;
        let isResizing = false;
        let startX = 0;
        let startY = 0;
        let startWidth = 0;
        let startHeight = 0;
        let createdStories = [];

        const avatarConfig = {
            gender: 'female',
            hair_style: 'wavy',
            hair_color: 'blue',
            eye_color: 'green'
        };

        const hairStyles = {
            male: ['curly', 'shaved', 'straight'],
            female: ['curly', 'short', 'straight', 'wavy']
        };

        window.addEventListener('DOMContentLoaded', function() {
            updateHairStyleOptions('female');
            updateAvatarPreview(); // Initialize preview
        });

        // Avatar preview function using canvas and actual avatar assets
        async function updateAvatarPreview() {
            const canvas = document.getElementById('avatarCanvas');
            if (!canvas) return;
            
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;
            
            // Clear canvas
            ctx.clearRect(0, 0, width, height);
            
            // Build avatar preview paths
            const gender = avatarConfig.gender;
            const hairStyle = avatarConfig.hair_style;
            const hairColor = avatarConfig.hair_color;
            const eyeColor = avatarConfig.eye_color;
            
            // Normalize eye emotion folder
            const eyeEmotion = 'neutral';
            
            try {
                // Define layer paths
                let hairPath;
                if (hairStyle === 'shaved') {
                    hairPath = `/assets/avatar/${gender}/hair/${hairStyle}/shaved.png`;
                } else {
                    hairPath = `/assets/avatar/${gender}/hair/${hairStyle}/${hairColor}.png`;
                }
                
                const eyesPath = `/assets/avatar/${gender}/eyes/${eyeEmotion}/${eyeColor}.png`;
                const mouthPath = `/assets/avatar/${gender}/mouthshapes/neutral/REST.png`;
                
                // Helper function to load images
                const loadImage = (src) => {
                    return new Promise((resolve, reject) => {
                        const img = new Image();
                        img.crossOrigin = "anonymous";
                        img.onload = () => resolve(img);
                        img.onerror = () => {
                            console.warn('Failed to load:', src);
                            resolve(null);
                        };
                        img.src = src;
                    });
                };
                
                // Load all layers
                const [hairImg, eyesImg, mouthImg] = await Promise.all([
                    loadImage(hairPath),
                    loadImage(eyesPath),
                    loadImage(mouthPath)
                ]);
                
                // Draw layers in correct order: hair -> eyes -> mouth
                if (hairImg) ctx.drawImage(hairImg, 0, 0, width, height);
                if (eyesImg) ctx.drawImage(eyesImg, 0, 0, width, height);
                if (mouthImg) ctx.drawImage(mouthImg, 0, 0, width, height);
                
            } catch (error) {
                console.error('Error loading avatar preview:', error);
                // Show fallback
                ctx.fillStyle = '#6b7280';
                ctx.font = '16px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('Preview Loading...', width / 2, height / 2);
            }
        }

        function updateHairStyleOptions(gender) {
            const container = document.getElementById('hairStyleOptions');
            container.innerHTML = '';
            
            const styles = hairStyles[gender];
            styles.forEach((style) => {
                const btn = document.createElement('button');
                // Check if this style matches the current avatarConfig
                btn.className = 'option-btn' + (style === avatarConfig.hair_style ? ' selected' : '');
                btn.setAttribute('data-value', style);
                btn.textContent = style.replace('_', ' ');
                btn.onclick = function() { selectOption('hair_style', style, this); };
                container.appendChild(btn);
            });
            
            // Only update if current style is not valid for this gender
            if (!styles.includes(avatarConfig.hair_style)) {
                avatarConfig.hair_style = styles[0]; // or styles[styles.length - 1] for last
            }
        }

        function selectOption(category, value, button) {
            const siblings = button.parentElement.querySelectorAll('.option-btn');
            siblings.forEach(btn => btn.classList.remove('selected'));
            button.classList.add('selected');
            avatarConfig[category] = value;
            
            if (category === 'gender') {
                updateHairStyleOptions(value);
            }
            
            if (category === 'hair_style' && value === 'shaved') {
                document.getElementById('hairColorGroup').style.display = 'none';
            } else if (category === 'gender' || category === 'hair_style') {
                document.getElementById('hairColorGroup').style.display = 'block';
            }
            
            // Update preview when any option changes
            updateAvatarPreview();
        }

        function openCreator() {
            document.getElementById('homePage').style.display = 'none';
            document.getElementById('creatorPage').classList.add('active');
        }

        function closeCreator() {
            document.getElementById('homePage').style.display = 'flex';
            document.getElementById('creatorPage').classList.remove('active');
        }

        function openCustomization() {
            document.getElementById('avatarModal').classList.add('show');
            updateAvatarPreview(); // Initialize preview
        }

        function closeCustomization() {
            document.getElementById('avatarModal').classList.remove('show');
        }

        function saveCustomization() {
            closeCustomization();
        }

        function addText() {
            document.getElementById('textModal').classList.add('show');
            document.getElementById('textInput').focus();
        }

        function closeTextInput() {
            document.getElementById('textModal').classList.remove('show');
            document.getElementById('textInput').value = '';
        }

        function confirmAddText() {
            const text = document.getElementById('textInput').value.trim();
            if (!text) return;

            const canvas = document.getElementById('canvasContainer');
            const textOverlay = document.createElement('div');
            textOverlay.className = 'text-overlay';
            textOverlay.textContent = text;
            textOverlay.style.left = '50px';
            textOverlay.style.top = '100px';
            
            canvas.appendChild(textOverlay);
            setupDraggable(textOverlay);
            closeTextInput();
        }

        function handleAudioUpload(event) {
            const file = event.target.files[0];
            if (file && file.type.startsWith('audio/')) {
                audioFile = file;
                document.getElementById('generateBtn').disabled = false;
                document.getElementById('emptyState').innerHTML = '<div style="color: #667eea;">✓ Audio uploaded</div>';
            }
        }

        async function generateVideo() {
            if (!audioFile) return;

            document.getElementById('processingOverlay').classList.add('show');

            const formData = new FormData();
            formData.append('audio', audioFile);
            formData.append('gender', avatarConfig.gender);
            formData.append('hair_style', avatarConfig.hair_style);
            formData.append('hair_color', avatarConfig.hair_color);
            formData.append('eye_color', avatarConfig.eye_color);

            try {
                const response = await fetch('/api/process-text', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                
                if (data.success) {
                    const videoUrl = data.video_url ? `${window.location.origin}${data.video_url}` : null;
                    addVideoToCanvas(videoUrl);
                } else {
                    throw new Error(data.error || 'Generation failed');
                }
            } catch (error) {
                alert('Failed: ' + error.message);
            } finally {
                document.getElementById('processingOverlay').classList.remove('show');
            }
        }

        function addVideoToCanvas(videoUrl) {
            const canvas = document.getElementById('canvasContainer');
            const existing = canvas.querySelector('.video-container-draggable');
            if (existing) existing.remove();

            document.getElementById('emptyState').style.display = 'none';

            const container = document.createElement('div');
            container.className = 'video-container-draggable';
            container.style.width = '250px';
            container.style.height = '250px';
            container.style.left = '90px';
            container.style.top = '300px';

            const video = document.createElement('video');
            video.src = videoUrl;
            video.loop = false;
            video.muted = false;
            video.controls = true;
            video.preload = 'metadata';
            video.volume = 0.5;
            
            const resizeHandle = document.createElement('div');
            resizeHandle.className = 'resize-handle';

            container.appendChild(video);
            container.appendChild(resizeHandle);
            canvas.appendChild(container);

            videoElement = video;
            setupDraggable(container);
            setupResizable(container, resizeHandle);
        }

        function setupDraggable(element) {
            element.addEventListener('mousedown', function(e) {
                if (e.target.tagName === 'VIDEO') return;
                if (e.target.classList.contains('resize-handle')) return;
                
                document.querySelectorAll('.video-container-draggable, .text-overlay').forEach(el => {
                    el.classList.remove('selected');
                });
                
                element.classList.add('selected');
                selectedElement = element;
                isDragging = true;
                
                const rect = element.getBoundingClientRect();
                startX = e.clientX - rect.left;
                startY = e.clientY - rect.top;
                
                e.preventDefault();
                e.stopPropagation();
            });
        }

        function setupResizable(container, handle) {
            handle.addEventListener('mousedown', function(e) {
                selectedElement = container;
                container.classList.add('selected');
                isResizing = true;
                
                startX = e.clientX;
                startY = e.clientY;
                startWidth = container.offsetWidth;
                startHeight = container.offsetHeight;
                
                e.stopPropagation();
                e.preventDefault();
            });
        }

        document.addEventListener('mousemove', function(e) {
            if (isDragging && selectedElement) {
                const parentRect = selectedElement.parentElement.getBoundingClientRect();
                
                let newLeft = e.clientX - parentRect.left - startX;
                let newTop = e.clientY - parentRect.top - startY;
                
                newLeft = Math.max(0, Math.min(newLeft, parentRect.width - selectedElement.offsetWidth));
                newTop = Math.max(0, Math.min(newTop, parentRect.height - selectedElement.offsetHeight));
                
                selectedElement.style.left = newLeft + 'px';
                selectedElement.style.top = newTop + 'px';
            }
            
            if (isResizing && selectedElement) {
                const deltaX = e.clientX - startX;
                const deltaY = e.clientY - startY;
                
                const newWidth = startWidth + deltaX;
                const newHeight = startHeight + deltaY;
                
                if (newWidth > 50 && newHeight > 50) {
                    selectedElement.style.width = newWidth + 'px';
                    selectedElement.style.height = newHeight + 'px';
                }
            }
        });

        document.addEventListener('mouseup', function() {
            isDragging = false;
            isResizing = false;
        });

        document.getElementById('canvasContainer').addEventListener('click', function(e) {
            if (e.target.id === 'canvasContainer') {
                document.querySelectorAll('.video-container-draggable, .text-overlay').forEach(el => {
                    el.classList.remove('selected');
                });
                selectedElement = null;
            }
        });

        function deleteSelected() {
            if (selectedElement) {
                selectedElement.remove();
                selectedElement = null;
            }
        }

        function changeBackground(element, gradient) {
            document.querySelectorAll('.bg-option').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
            document.getElementById('canvasContainer').style.background = gradient;
            document.getElementById('canvasContainer').style.backgroundSize = 'cover';
            document.getElementById('canvasContainer').style.backgroundPosition = 'center';
        }

        function handleBackgroundUpload(event) {
            const file = event.target.files[0];
            if (file && file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const canvas = document.getElementById('canvasContainer');
                    canvas.style.background = `url(${e.target.result})`;
                    canvas.style.backgroundSize = 'cover';
                    canvas.style.backgroundPosition = 'center';
                    
                    document.querySelectorAll('.bg-option').forEach(el => el.classList.remove('selected'));
                };
                reader.readAsDataURL(file);
            }
        }

        function captureCanvas() {
            const canvas = document.getElementById('canvasContainer');
            
            return {
                background: canvas.style.background,
                videoUrl: videoElement ? videoElement.src : null,
                timestamp: new Date(),
                preview: canvas.style.background
            };
        }

        function postStory() {
            if (!videoElement) {
                alert('Please generate a video first!');
                return;
            }

            const storyData = captureCanvas();
            createdStories.unshift(storyData);
            
            document.getElementById('creatorPage').classList.remove('active');
            document.getElementById('homePage').style.display = 'flex';
            refreshFeed();
        }

        function refreshFeed() {
            const feed = document.querySelector('.insta-feed');
            
            const existingPosts = feed.querySelectorAll('.feed-post.user-created');
            existingPosts.forEach(post => post.remove());

            createdStories.forEach((story, index) => {
                const postDiv = document.createElement('div');
                postDiv.className = 'feed-post user-created';
                
                const previewStyle = story.background;
                
                postDiv.innerHTML = `
                    <div class="post-header">
                        <div class="post-avatar" style="background: linear-gradient(135deg, #667eea, #764ba2);"></div>
                        <div>
                            <div style="font-size: 14px; font-weight: 600; color: #262626;">You</div>
                            <div style="font-size: 12px; color: #8e8e8e;">Just now</div>
                        </div>
                    </div>
                    <div class="post-image" style="background: ${previewStyle}; background-size: cover; background-position: center; position: relative; display: flex; align-items: center; justify-content: center;">
                        ${story.videoUrl ? `
                            <video src="${story.videoUrl}" style="max-width: 90%; max-height: 90%; border-radius: 12px; object-fit: contain;" muted loop autoplay></video>
                        ` : ''}
                        <div style="position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.6); padding: 6px 12px; border-radius: 8px; font-size: 11px; color: white;">
                            🎬 Lipsync Story
                        </div>
                    </div>
                    <div style="padding: 12px 15px;">
                        <div style="font-size: 13px; color: #262626;">
                            ✨ Created with Emotion AI
                        </div>
                    </div>
                `;
                
                feed.insertBefore(postDiv, feed.firstChild);
            });
        }
    </script>
</body>
</html>
